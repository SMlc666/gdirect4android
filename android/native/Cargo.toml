[package]
name = "gdirect-android"
version = "1.0.0-rc2"
edition = "2024"
publish = false

[lib]
name = "gdirect_android"
crate-type = ["cdylib"]

# Reuse the exact upstream network-interface and state-store source files.
# Original patched libaria2 is cross-compiled and linked by Android CI.
[dependencies]
jni = "0.21.1"
anyhow = "1"
dirs = "6"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
socket2 = { version = "0.6", features = ["all"] }

rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"

sha2 = "0.11"

md-5 = "0.11"
serde_json = "1"

[build-dependencies]
cc = "1"
