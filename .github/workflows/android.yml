name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'src/netif.rs'
      - 'src/store.rs'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'src/netif.rs'
      - 'src/store.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already includes Android SDK command-line tools.
      # setup-android@v3 currently fails by requesting the removed 'tools' package.
      - name: Add preinstalled SDK tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK and NDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native -> android/native/target

      - name: Unit-test Android Rust HTTP parser on host
        run: cargo test --manifest-path android/native/Cargo.toml --lib

      - name: Cache Android libaria2 and OpenSSL cross-built archives
        uses: actions/cache@v4
        with:
          path: |
            android/native/target/android-openssl
            android/native/target/android-aria2
            android/native/target/vendor/openssl-3.5.9.tar.gz
            android/native/target/vendor/aria2-1.37.0.tar.xz
            android/native/src/aria2_android_bridge.cc
          key: gdirect-android-arm64-native-openssl3.5.9-aria2-1.37.0-r1

      - name: Build patched libaria2 + OpenSSL Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          bash android/native/build-aria2-android.sh
          sed -i '/#include <cstdint>/a extern uint64_t gdirect_android_network;' android/native/src/aria2_android_bridge.cc
          grep -q 'extern uint64_t gdirect_android_network' android/native/src/aria2_android_bridge.cc

      - name: Build Rust JNI library for arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --manifest-path android/native/Cargo.toml --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp android/native/target/aarch64-linux-android/release/libgdirect_android.so android/app/src/main/jniLibs/arm64-v8a/
          test -s android/app/src/main/jniLibs/arm64-v8a/libgdirect_android.so

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Display APK signing SHA-1 for Android Google OAuth
        shell: bash
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep 'SHA1:' || true

      - name: Verify JNI library packaged in APK
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libgdirect_android.so'

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gdirect4android-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
