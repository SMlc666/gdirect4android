plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smlc.gdirectandroid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smlc.gdirectandroid'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.9'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    // Google Identity Services AuthorizationClient handles Android OAuth,
    // user consent and short-lived tokens via Google Play services.
    implementation "com.google.android.gms:play-services-auth:22.0.0"
}
