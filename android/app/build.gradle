plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smlc.gdirectandroid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smlc.gdirectandroid'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.9.1-alpha.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

